name: Verified release artifact
run-name: PM release ${{ inputs.operation }}
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Project Manager release operation ID
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-artifact-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-once:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OCR runtime for complete functional tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr fonts-dejavu-core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build and test dependencies
        run: python -m pip install -r requirements-runtime.lock -e '.[dev]'
      - run: ruff check .
      - run: pytest
      - name: Build exactly one wheel
        run: python -m build --wheel --outdir release-artifact
      - name: Bind artifact to source commit
        run: |
          set -eu
          set -- release-artifact/*.whl
          test "$#" -eq 1
          python tools/release_artifact.py create "$1" --commit "$GITHUB_SHA" --manifest release-artifact/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: verified-wheel-${{ github.sha }}-${{ inputs.operation }}
          path: release-artifact/
          if-no-files-found: error
          retention-days: 14
  test-same-artifact:
    needs: build-once
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OCR runtime for complete functional tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr fonts-dejavu-core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: verified-wheel-${{ github.sha }}-${{ inputs.operation }}
          path: release-artifact
      - name: Reject mismatched bytes or source
        run: python tools/release_artifact.py verify release-artifact --commit "$GITHUB_SHA" --manifest release-artifact/manifest.json
      - name: Install the built wheel; do not rebuild
        run: |
          python -m pip install -r requirements-runtime.lock release-artifact/*.whl 'pytest>=8,<9' 'httpx>=0.27,<1'
          cd /tmp
          python -m pytest "$GITHUB_WORKSPACE/tests"
